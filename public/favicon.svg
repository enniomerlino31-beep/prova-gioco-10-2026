<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icona della scheda: un'ascia piantata in un ceppo, sulla neve, con il cielo del gioco dietro -->
  <defs>
    <clipPath id="forma"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#forma)">
    <rect width="64" height="64" fill="#bfe3f7"/>
    <ellipse cx="32" cy="61" rx="36" ry="13" fill="#ffffff"/>
    <!-- il ceppo -->
    <rect x="13" y="37" width="38" height="18" rx="4" fill="#8a4f1f" stroke="#4a2a12" stroke-width="3"/>
    <ellipse cx="32" cy="37" rx="19" ry="8.5" fill="#e6b068" stroke="#4a2a12" stroke-width="3"/>
    <ellipse cx="32" cy="37" rx="11" ry="4.6" fill="none" stroke="#b8772f" stroke-width="2"/>
    <ellipse cx="32" cy="37" rx="4.5" ry="2" fill="none" stroke="#b8772f" stroke-width="1.8"/>
    <!-- l'ascia, un po' inclinata: manico di legno, lama d'acciaio e dietro la lama il "dorso" scuro -->
    <g transform="rotate(-24 32 38)">
      <rect x="29.2" y="6" width="5.6" height="34" rx="2.8" fill="#c78a4a" stroke="#4a2a12" stroke-width="2.6"/>
      <rect x="23.5" y="8.5" width="8.5" height="12" rx="2.5" fill="#6f8196" stroke="#2f2a3a" stroke-width="2.6"/>
      <path d="M32 7.5C45 3.5 54 10.5 52 27C46.5 23.5 40 22.5 32 22.5Z" fill="#a9bccf" stroke="#2f2a3a" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M39.5 12C44 10.5 48 12.5 49.5 17.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
